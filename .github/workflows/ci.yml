name: CI
on:
  pull_request:
  push:
    branches: [main, preview]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - run: npm run proof
      - run: node scripts/sheet.mjs && node scripts/motion.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: proof
          path: proof/*.html
